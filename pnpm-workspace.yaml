# pnpm workspace + settings (single source of truth for pnpm config).
# Since pnpm 10.6 project-level pnpm settings live here rather than in .npmrc.
# Docs: https://pnpm.io/settings

packages:
  - website
  - devtools-client-app

# --- Catalog: one version, used across every workspace package ---------------
# Reference with `"nuxt": "catalog:"` in package.json so the root module and the
# website can never drift onto different Nuxt majors. https://pnpm.io/catalogs
catalog:
  nuxt: ^4.5.1

# --- Node module layout ------------------------------------------------------
# Nuxt/Vite + Convex codegen expect a flat node_modules; keep the hoisted linker.
nodeLinker: hoisted

# --- Supply-chain security ---------------------------------------------------
# Lifecycle (postinstall) scripts are blocked for every dependency by default
# (pnpm 10+). Only the packages explicitly set to `true` here may run them;
# anything not listed (or set to false) is denied. This is the allowlist that
# `pnpm approve-builds` maintains.
allowBuilds:
  '@parcel/watcher': true
  # Transitive only (via @nuxt/content, better-auth, db0) — never imported: Content
  # uses Node's built-in `node:sqlite`, better-auth runs against Convex. Don't compile
  # its native addon.
  better-sqlite3: false
  # Transitive only (via @auth0/auth0-spa-js). Its postinstall just prints a
  # promotional banner — nothing is built; keep it denied.
  browser-tabs-lock: false
  esbuild: true
  sharp: true # Image optimization (Nuxt Image / OG images) for the docs site (Docus)
  unrs-resolver: true
  vue-demi: true

# Cooldown: refuse to install any package version published less than 1440
# minutes (24h) ago. Blunts "compromised release pulled within hours" attacks
# (the chalk/debug/nx class of incidents). pnpm picks the newest version that
# satisfies the range AND clears the cooldown. https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# Waived for first-party frameworks: a compromised @nuxt/* or convex release is
# caught within minutes by a large user base, and we want same-day access to
# fixes in our own stack. Mirrored by `cooldown.exclude` in .github/dependabot.yml —
# keep the two lists in sync, or Dependabot proposes versions pnpm refuses to
# resolve.
minimumReleaseAgeExclude:
  - nuxt
  - 'nuxt-*'
  - '@nuxt/*'
  - '@nuxtjs/*'
  - convex
  - convex-helpers
  - '@convex-dev/*'

# Refuse transitive dependencies pulled from exotic sources (git repos, raw
# tarball URLs) — those bypass registry auditing entirely.
blockExoticSubdeps: true

# Refuse an install when a package's trust level drops versus prior releases
# (e.g. provenance/attestation disappears) — a compromised-account tell.
trustPolicy: no-downgrade

# `no-downgrade` compares by publish date across a package's whole history: a
# version fails if any earlier-published one carried stronger trust evidence.
# A late maintenance release on an old major therefore reads as a downgrade
# once the current major has moved to signed releases.
trustPolicyExclude:
  # Hand-published backport on the 6.x branch (2023-07-10, no attestation);
  # semver 7.x was already publishing with provenance via CI by then. Pulled in
  # by @babel/core and two @babel/helper-* packages, which pin semver ^6.
  - semver@6.3.1

# --- Integrity ---------------------------------------------------------------
# Warn (without blocking) when node_modules is out of sync with the lockfile
# before running a script, so stale installs are caught early.
verifyDepsBeforeRun: warn
