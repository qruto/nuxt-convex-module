  <!-- A two-hue wash under the mark: Nuxt green entering from the left, Convex
       magenta from the right. Both ellipses reach zero exactly ON the frame,
       vertically included — a radial gradient the viewBox clips leaves a hard
       seam along the edge it is cut at, and this banner has no ground of its
       own to hide one behind. -->
  <ellipse cx="234" cy="72" rx="196" ry="72" fill="url(#wash-nuxt)" />
  <ellipse cx="326" cy="72" rx="196" ry="72" fill="url(#wash-convex)" />

