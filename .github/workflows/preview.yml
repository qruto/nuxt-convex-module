name: preview

# Continuous preview releases via pkg.pr.new (StackBlitz): every PR and every
# push to main gets an installable build —
#   npm i https://pkg.pr.new/qruto/nuxt-convex-module@<sha>
# — and a runnable one, as a StackBlitz playground built from
# `examples/playground` with that same build wired in, so a change can be tried
# in a real Nuxt app straight from the PR comment.
# Auth is handled by the pkg.pr.new GitHub App installed on the repository;
# the workflow token needs no extra permissions.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded pull request runs are cancelled, pushes to main are not — same
# reason as ci.yml. Here it matters less (a cancelled preview only means a
# missing comment), but there is nothing to gain by killing it either.
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This job builds PR-authored code — from forks included — and then talks
      # to an external service. Audit-mode egress monitoring gives that a
      # baseline; there are no secrets here to protect, but there is untrusted
      # code with network access, which is the case worth observing.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      # --pnpm packs with `pnpm pack` so `catalog:` ranges are rewritten,
      # exactly like a real `pnpm publish`. Packing runs `prepack` (the build).
      #
      # `pnpm exec`, not `pnpm dlx`: pkg-pr-new is a devDependency, so the
      # version that runs here is the one in the lockfile — under pnpm's
      # minimumReleaseAge cooldown and under Dependabot, like every other
      # dependency. `dlx` resolved whatever was newest at run time and executed
      # it on every PR.
      #
      # --template is not optional. pkg.pr.new only skips its synthesised
      # "default" template when an explicit one is given, and that default is an
      # empty index.js beside a package.json whose sole dependency is the
      # tarball — no nuxt, no vue, no convex — so the "Open in StackBlitz" link
      # opened something that could not run. `examples/playground` replaces it
      # with a real app. Two constraints follow from how templates are shipped:
      # the directory is uploaded standalone (no workspace, no lockfile), and
      # only our own package names are rewritten to pkg.pr.new URLs — so a
      # `catalog:` or `workspace:` range in there would reach npm verbatim and
      # fail. The path is explicit rather than './examples/*' so a new example
      # cannot start appearing in public PR comments before it is ready.
      #
      # Note this step runs on pull_request, forks included: what the template
      # contains, and the name it is linked under, are PR-authored. Sandboxed
      # and plainly a PR artifact, but `examples/playground` is review surface
      # in fork PRs the way workflow files already are.
      - name: Publish preview
        run: pnpm exec pkg-pr-new publish --pnpm --comment=update --template './examples/playground'
