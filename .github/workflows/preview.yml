name: preview

# Continuous preview releases via pkg.pr.new (StackBlitz): every PR and every
# push to main gets an installable build —
#   npm i https://pkg.pr.new/qruto/nuxt-convex-module@<sha>
# Auth is handled by the pkg.pr.new GitHub App installed on the repository;
# the workflow token needs no extra permissions.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --pnpm packs with `pnpm pack` so `catalog:` ranges are rewritten,
      # exactly like a real `pnpm publish`. Packing runs `prepack` (the build).
      - name: Publish preview
        run: pnpm dlx pkg-pr-new publish --pnpm --comment=update
