name: weekly

# Everything that runs on a clock rather than on a commit, in one file.
#
# None of it gates a merge — a scheduled check that can block a pull request
# fails the wrong person at the wrong time. These exist to notice DRIFT: the
# world moving underneath a repository that did not change.

on:
  # No `branch_protection_rule` trigger: it fires for CLASSIC branch protection,
  # which this repository does not use — every rule here is a ruleset, and a
  # ruleset change fires nothing. The `rulesets` job below covers that drift on
  # the schedule instead, and dispatch is there for when you want it now.
  schedule:
    - cron: '3 7 * * 1' # Mondays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Audits the repository's own posture — pinned actions, token permissions,
  # branch protection, signed releases, dangerous workflow patterns. Most of it
  # this repository already does deliberately; the value is being told when that
  # stops being true: a ruleset relaxed, a `permissions:` block widened, an
  # action unpinned.
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # sign the results for the public Scorecard API
      security-events: write # publish results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API, which is what backs the badge
          # and lets consumers check the score without running it themselves.
          publish_results: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: results.sarif

  # Re-examines the whole committed lockfile against OSV, which ci's
  # `dependency-review` structurally cannot: that job inspects the dependency
  # DELTA a pull request introduces, so an advisory published against a package
  # that stopped changing is invisible to it.
  #
  # Kept rather than deleted in favour of Dependabot alerts, which cover much of
  # the same ground. The overlap is real but not total — OSV aggregates sources
  # beyond GHSA and reaches transitives the dependency graph can fail to parse —
  # and the cost of a second opinion here is one scheduled job a week that can
  # never redden a pull request.
  osv:
    # The reusable workflow declares the same three permissions on its own job;
    # they have to be granted here as well for it to inherit them.
    permissions:
      contents: read
      actions: read # required to upload SARIF, see github/codeql-action#2117
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # `-r ./` walks the workspace and picks up pnpm-lock.yaml natively, plus
      # the website and devtools-client-app manifests.
      scan-args: |-
        -r
        ./

  # The rules that gate `main` are committed under .github/rulesets/, which only
  # means anything if something checks that they still describe reality. They
  # are edited in a settings page, and GitHub fills in defaults the committed
  # file never mentioned — both have already happened here.
  #
  # Scorecard (above) notices that branch protection exists. This notices that
  # it stopped matching what was reviewed: a rule removed, a parameter changed,
  # a bypass actor added, or a whole ruleset that exists only as clicks.
  #
  # Read-only. A drift is a conversation, not an automatic revert.
  rulesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # rulesets on a public repository are readable without more
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare live rules against the committed ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-rulesets.mjs

  # Dead links in the docs, the README and the policy files. Prose is the one
  # part of this repository nothing else checks for rot — SECURITY.md linked a
  # repository that had moved for months, and no gate could have known.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Config and exclusions live in lychee.toml. `--root-dir` has to be an
          # absolute path, so it cannot: it lets the docs' root-relative route
          # links resolve, after which `scheme` filters them out. Without it they
          # fail to resolve first and no filter is ever reached.
          args: >-
            --no-progress
            --config lychee.toml
            --root-dir ${{ github.workspace }}/website/content
            .
          fail: true

  # The whole point of the four jobs above is to be noticed. Without this they
  # are not: a scheduled run's only failure signal is an email to whoever last
  # edited the cron, which is the wrong person on a long enough timeline and
  # nobody at all once it lands in a filter.
  #
  # An issue is the right shape — it survives, it can be assigned, and it is
  # where a drift conversation belongs. One issue reused rather than a new one
  # each Monday, or a fortnight of neglect buries the first report.
  #
  # `issues: write` on a job that checks nothing out and installs nothing; the
  # same reasoning that keeps ci's Codecov credential in its own job.
  report:
    needs:
      - scorecard
      - osv
      - rulesets
      - links
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: >-
            scorecard=${{ needs.scorecard.result }}
            osv=${{ needs.osv.result }}
            rulesets=${{ needs.rulesets.result }}
            links=${{ needs.links.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s\n' "$RESULTS" "$RUN_URL")
          # Listed and matched exactly, not searched: `--search` depends on
          # GitHub's search index, and `in:title` is full-text, so it would also
          # match an unrelated issue that happens to say "weekly drift". Not
          # `--label` either — the filter matches nothing until the label exists,
          # which fails by opening a second issue every Monday rather than
          # loudly.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "ci: weekly drift")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title 'ci: weekly drift' --body "$body"
          fi
