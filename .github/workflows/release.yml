name: Release

# Manually triggered from the Actions tab (Release → Run workflow). Performs the
# whole release in CI — no local tooling, no stored secrets — and ends in npm's
# stage queue, where a maintainer approves it with 2FA:
#
#   tag      wait for ci · verify HEAD is the release commit · tag → push     contents: write
#            → changelogen gh release (immutable)                              environment: release
#   build    check out the tag · pack · check:tarball                          contents: read
#   publish  pnpm stage publish (Trusted Publishing/OIDC + provenance)         id-token: write
#                                                                              environment: release
#   laptop   pnpm stage approve <id>     2FA — the moment the version goes live
#
# The version bump happens BEFORE this workflow, in `Release prepare`, which
# opens a pull request carrying the bumped package.json and CHANGELOG.md. This
# workflow only tags what was merged — so the release commit passes the same
# checks as every other commit, and nothing here writes to main.
#
# That split is also why the `tag` job must never run `changelogen --release`
# again: it would bump a second time and tag v0.1.1 for a 0.1.0 release.
#
# The `release` environment (required reviewer, main only) gates both jobs that
# can do damage — GitHub evaluates protection rules per job, so it prompts once
# before anything is written to the repository and again before anything reaches
# npm. It is also what the npm Trusted Publisher is bound to: an OIDC token is
# accepted only from a job that ran in `release`, and a job can run in it only
# from main, so a release.yml edited on a scratch branch can neither mutate the
# repository nor reach npm's queue.
#
# The credentials never meet the code. `tag` holds the write token and no OIDC.
# `build` runs the dependency code and holds nothing. `publish` holds the OIDC
# token and runs nothing but one pinned pnpm on one tarball, behind an egress
# allowlist.
#
# With `dry-run: true` nothing is written and nothing uploaded: `tag` reports the
# version a release would produce, `build` packs and validates main as it is,
# `publish` performs the real OIDC exchange and stops. Rehearse after every
# change to this file.
#
# `re-stage` is the recovery path for a release whose publish failed after the
# tag was already pushed: it skips the bump and stages that tag again.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Rehearse only — build, validate, exchange the OIDC token, write and upload nothing
        type: boolean
        default: false
      re-stage:
        description: Existing tag (vX.Y.Z) to stage again after a failed publish — skips the bump
        type: string
        default: ''

# One release at a time; never cancel a publish midway.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default — every job declares the minimum it needs.
permissions: {}

env:
  DRY_RUN: ${{ inputs.dry-run }}
  RE_STAGE: ${{ inputs.re-stage }}

jobs:
  # The only job that writes to the repository — and now it writes exactly one
  # thing: a tag on a commit that is already on main and already green. It runs
  # dependency code (`pnpm install`, for changelogen's GitHub Release step) with
  # the write token in reach, which is why it holds no OIDC token, why the
  # `release` environment's reviewer must approve before it starts, and why the
  # rulesets keep it from rewriting history.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # push the release commit + tag, create the GitHub Release
      actions: read # `gh run list` / `gh run watch` read this repository's workflow runs
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      pnpm-version: ${{ steps.version.outputs.pnpm-version }}
    steps:
      # Audit-mode egress monitoring for the job that holds the write token and
      # runs dependency code. StepSecurity's global blocklist is enforced even in
      # audit mode.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Never release a commit whose ci run isn't a completed success — and wait
      # for it rather than re-running its jobs here. `--event push` accepts only
      # a run on main; a pull_request run on the same commit does not count.
      # Skipped when re-staging: that tag was gated when it was created.
      - name: Wait for ci on this commit
        if: env.RE_STAGE == ''
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --event push \
              --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No ci push run for $GITHUB_SHA after 5 minutes — is this commit on main?"
            exit 1
          fi
          gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --exit-status
          conclusion=$(gh run view --repo "$GITHUB_REPOSITORY" "$run_id" --json conclusion --jq .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci run $run_id for $GITHUB_SHA concluded '$conclusion' — nothing was released."
            exit 1
          fi

      # persist-credentials: false — the push below carries the token in that one
      # step's environment, so it never lands in .git/config during the install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: `HEAD~1` below, and changelogen's Release step
          persist-credentials: false

      # One action for pnpm (version from `packageManager`), the Node LTS
      # runtime and `pnpm install`. No cache: a restored cache is an input
      # nobody reviewed, and a release pipeline takes no unreviewed inputs
      # (TanStack, May 2026). `require-lockfile` refuses the one install pnpm's
      # own CI frozen mode does not — no lockfile at all.
      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: false
          require-lockfile: true

      - name: Configure git
        if: env.RE_STAGE == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # HEAD must BE the merged release commit — the one whose package.json
      # version differs from its parent's.
      #
      # Without this, an ordinary pull request merging between the release PR
      # and this dispatch puts the tag on that later commit instead. The
      # tag↔manifest check in `build` still passes (the version in package.json
      # is unchanged), so v1.2.0 would ship pointing at a commit that was never
      # reviewed as a release. Nothing downstream can detect it afterwards.
      - name: Verify HEAD is the release commit
        if: env.RE_STAGE == ''
        run: |
          current=$(jq -r .version package.json)
          previous=$(git show 'HEAD~1:package.json' | jq -r .version)
          if [ "$current" = "$previous" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::HEAD does not bump the version (package.json says $current on this commit and its parent)."
              echo "::warning::A real release would stop here. Continuing: a rehearsal must run on an ordinary main."
            else
              echo "::error::HEAD ($GITHUB_SHA) does not bump the version — package.json says $current on both this commit and its parent."
              echo "::error::Run 'Release prepare' and merge its pull request, then dispatch this workflow on the merge commit."
              exit 1
            fi
          else
            echo "HEAD bumps $previous -> $current."
          fi

      # What the rest of the run builds from. A real release: the tag just
      # created. A dry run: main as dispatched. A re-stage: the tag given.
      - name: Resolve the release ref
        id: version
        run: |
          if [ -n "$RE_STAGE" ]; then
            git rev-parse --verify --quiet "refs/tags/$RE_STAGE^{commit}" >/dev/null \
              || { echo "::error::Tag $RE_STAGE does not exist."; exit 1; }
            version="${RE_STAGE#v}"
            ref="refs/tags/$RE_STAGE"
          else
            version=$(jq -r .version package.json)
            if [ "$DRY_RUN" = "true" ]; then
              ref="$GITHUB_SHA"
            else
              ref="refs/tags/v$version"
            fi
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            # The exact pnpm `publish` will run — the one `packageManager` pins.
            jq -r '"pnpm-version=" + (.packageManager | ltrimstr("pnpm@") | split("+")[0])' package.json
          } >> "$GITHUB_OUTPUT"

      # The tag, and nothing else — the commit is already on main, put there by
      # the merged release pull request. The tag ruleset then freezes it. The
      # token lives in this step's environment only.
      - name: Tag the release commit
        if: env.DRY_RUN != 'true' && env.RE_STAGE == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v$VERSION"

      # changelogen's own GitHub Release sync: reads the top section of
      # CHANGELOG.md — written by `Release prepare` and merged with this commit —
      # and creates the Release for that tag (updates it if it exists). Immutable releases are on, so the Release locks the tag and
      # carries a release attestation — `gh release verify vX.Y.Z`.
      - name: Create the GitHub Release
        if: env.DRY_RUN != 'true' && env.RE_STAGE == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changelogen gh release

      - name: Report the planned release
        if: env.RE_STAGE == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            suffix=" (dry run — nothing written, nothing staged)"
          else
            suffix=""
          fi
          {
            echo "## v${VERSION}${suffix}"
            echo
            awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Produces the artifact a release consists of, from a pristine checkout of the
  # tag — not from the working tree that made it. No id-token, no write
  # credentials: this is the job that runs the build, with nothing worth
  # stealing in its environment.
  build:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false

      # The tag is the version. package.json has to agree, or npm and git would
      # describe two different releases. Read with jq: nothing from node_modules
      # runs before the version is trusted.
      - name: Verify the tag matches the manifest
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          actual=$(jq -r .version package.json)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Checked out v$VERSION but package.json says $actual."
            exit 1
          fi

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: false
          require-lockfile: true

      # Generates `.nuxt/tsconfig.json`. Without it `nuxt-module-build` can't
      # resolve compiler options and the prepack below fails.
      - name: Prepare
        run: pnpm run dev:prepare

      # Runs `prepack` (the full build) and rewrites `catalog:` ranges exactly
      # like `pnpm publish` would. This tarball is the thing that gets staged —
      # npm never repacks it.
      - name: Pack
        run: pnpm pack

      # The same script ci runs against every PR's tarball, so a release tarball
      # cannot ship a regression a pull request would have been failed for.
      - name: Check the tarball
        run: pnpm run check:tarball

      # `publish` downloads only this, so the privileged job never has the
      # repository's files on disk.
      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: nuxt-convex-module-*.tgz
          retention-days: 1
          if-no-files-found: error

  # The only job that can publish. Its entire attack surface is one pinned pnpm
  # and one tarball: no checkout, no `pnpm install`, no build, no Node.
  publish:
    needs:
      - tag
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm Trusted Publisher is bound to this environment, whose deployment
    # policy admits only main — see the header. The reviewer prompt fires a
    # second time here: after the build, before anything reaches npm.
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      # Block mode: DNS and connections to anything unlisted fail. The agent
      # implicitly allows GitHub's own runner infrastructure — the artifact
      # download and the OIDC token endpoint (*.actions.githubusercontent.com,
      # productionresultssa*.blob.core.windows.net) — and github.com /
      # api.github.com via GitHub's meta API; those two are repeated here so the
      # job does not depend on that fetch. registry.npmjs.org serves pnpm/setup's
      # download of pnpm, the OIDC exchange and the stage upload. *.sigstore.dev
      # (suffix match) covers Fulcio, Rekor v1 and the v2 shards, the TUF CDN
      # and the TSA. No sudo, no containers: nothing here needs either.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            *.sigstore.dev:443

      # pnpm's native executable, the exact version `packageManager` pins,
      # fetched from the registry and verified against npm's signature. No
      # runtime: pnpm needs no Node to publish. No install: there is no project
      # here, only a tarball.
      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ needs.tag.outputs.pnpm-version }}
          install: false

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball

      # Staged publishing: npm takes the tarball into a queue, and it becomes
      # installable only once a maintainer approves it with 2FA —
      #   pnpm stage list → pnpm stage view <id> → pnpm stage approve <id>
      # Given a tarball path, pnpm reads the manifest from inside it and runs no
      # scripts; there is no git repository here, so its git checks do not
      # apply. Auth is the OIDC exchange with the Trusted Publisher; the
      # provenance's subject is the tarball's own digest and its build metadata
      # comes from the GITHUB_* environment, so no checkout is needed.
      # `--provenance` is explicit on purpose: without it pnpm treats a failed
      # attestation as a warning and stages anyway; with it, no attestation
      # means no release.
      - name: Stage the release on npm
        if: env.DRY_RUN != 'true'
        run: pnpm stage publish ./nuxt-convex-module-*.tgz --provenance

      # `--dry-run` returns before any upload, but after the OIDC token is
      # minted and exchanged — so a rehearsal proves the Trusted Publisher
      # binding (repository, workflow filename, environment) end to end. pnpm
      # only *warns* when that exchange fails; the rehearsal fails on it, or a
      # green dry run would prove nothing. Sigstore is not reached in a dry run.
      - name: Rehearse the publish (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          if ! output=$(pnpm stage publish ./nuxt-convex-module-*.tgz --provenance --dry-run 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          case "$output" in
            *"Skipped OIDC"*)
              echo "::error::The OIDC exchange with npm failed — the Trusted Publisher binding is broken; a real release would fail the same way."
              exit 1 ;;
          esac

      - name: Report
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          {
            echo "Staged nuxt-convex-module@${VERSION}. Inspect and approve from a laptop:"
            echo
            echo '```sh'
            echo "pnpm stage list nuxt-convex-module"
            echo "pnpm stage view <stage-id>"
            echo "pnpm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
