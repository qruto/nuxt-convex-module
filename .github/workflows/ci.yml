name: ci

# Every per-commit gate lives here, in one file, so `ci-ok` can aggregate them
# and there is one place to read the gate set.
#
# Irrelevant work is skipped per JOB, never per workflow. A workflow-level
# `paths:`/`paths-ignore:` filter stops the run entirely, so the required check
# never reports at all — and GitHub shows "Expected — waiting for status"
# forever, with nothing to re-run. Job-level `if:` gets the same saving safely:
# the run still happens, the expensive jobs report `skipped`, and the aggregate
# gate counts `skipped` as a pass.
#
# Setup is defined once, in .github/actions/setup — that is where the pnpm
# version, the Node runtime and their action pin live.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Nothing by default — every job declares the minimum it needs.
permissions: {}

jobs:
  # Which of the expensive jobs this change actually needs. On a push to main
  # everything runs regardless — the cost is one run per merge, and a green main
  # is worth more than the minutes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `&shared` / `*shared` is a YAML anchor, which this action resolves —
          # so what both filters need is written once and a new shared path is
          # added in one place.
          filters: |
            shared: &shared
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            website:
              - *shared
              - 'website/**'
            src:
              - *shared
              - 'test/**'
              - 'scripts/**'
              - 'examples/**'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'build.config.ts'

  # Everything that needs a checkout, an install and nothing else. One job rather
  # than four: the setup is identical, and `if: !cancelled()` still gives a
  # per-gate verdict, so one push surfaces every problem at once instead of
  # stopping at the first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: commitlint reads the PR range and `fallow audit` diffs
          # against the PR base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      # Type-checks the published surface (module + Convex code). The website and
      # DevTools apps are checked by their own gates; the root tsconfig excludes
      # them.
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      # Enforce Conventional Commits on PRs. The local commit-msg hook gives fast
      # feedback but can be bypassed with --no-verify, so this is the gate that
      # actually keeps the history clean. Pushes to main are skipped — those
      # commits were already linted on their PR.
      - name: Commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run lint:commits --from "$BASE_SHA" --to "$HEAD_SHA"

      # Regenerating the committed TypeDoc reference must produce no diff,
      # otherwise source doc-comments and the published reference have diverged.
      - name: API reference drift
        if: ${{ !cancelled() }}
        run: pnpm run docs:api:check

      # Static analysis of the workflows themselves (template injection,
      # credential persistence, unpinned uses). Accepted findings live in
      # .github/zizmor.yml.
      # The action's `version` input defaults to `latest`, which makes zizmor an
      # unpinned input in a repository that pins every action to a digest: a new
      # release can add an audit and redden CI with no change here. Pin it, and
      # bump deliberately — that is when you read the new findings.
      - name: Workflow lint (zizmor)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: 1.30.0
          advanced-security: false

      # Correctness of the workflow files, which zizmor does not look at:
      # expression typing, `needs`/matrix references that do not exist, invalid
      # runner labels, malformed cron — plus shellcheck over every inline `run:`
      # block (ubuntu-latest ships shellcheck; actionlint picks it up from PATH).
      #
      # Pinned for the same reason as zizmor: a new actionlint can add a check
      # and redden CI with no change here. Accepted findings live in
      # .github/actionlint.yaml.
      - name: Workflow correctness (actionlint)
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

      # Misspellings in prose, comments, identifiers and workflow files. Config
      # and the accepted-word list live in _typos.toml — including the
      # `.git/` exclusion, without which `fetch-depth: 0` above would have it
      # reporting on old commit subjects.
      - name: Spelling (typos)
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

      # ── fallow runs last, and only fallow runs after this ────────────────
      #
      # The action is documented to be used with NO node setup step: checkout,
      # then `uses: fallow-rs/fallow@v3`. It installs the CLI itself with
      # `npm install -g` and calls a bare `fallow`, relying on the runner
      # image's own npm putting the global bin on PATH. There is no input to
      # point it at a binary — this is the only seam.
      #
      # That assumption does not survive `pnpm/setup` running first, which owns
      # the runtime here and deliberately creates no global shims
      # (`PNPM_CONFIG_GLOBAL_SHIMS: {"node":false}`). Deleting the step below and
      # pushing showed exactly that: "Installed fallow unknown version", then
      # "analyze.sh: line 665: fallow: command not found", and a failed job.
      # Loudly, which is the one good thing about that failure mode.
      #
      # So this points it at the lockfile's copy instead, which is the better
      # binary anyway: `fallow` is pinned exactly (3.22.0), so CI runs the same
      # build as .githooks — the README's own stated goal — under Dependabot,
      # the cooldown and pnpm's trust policy. The action's global install is
      # neither: on this glibc runner it fetches the MUSL package, which could
      # not have run even if PATH had reached it. Its signature verification
      # still runs, and reports on the binary that actually executes.
      #
      # `$GITHUB_PATH` PREPENDS, for every later step in the job — what zizmor's
      # `github-env` audit flags, correctly. The blast radius is made empty
      # rather than waived: the two steps that need it are the last two, and
      # nothing runs after them. Keep it that way; a step added below inherits a
      # PATH where 40-odd project binaries shadow the system's.
      - name: Put project binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

      # Dead code, unused exports/deps, duplication, complexity. Through the
      # action rather than the CLI for two things the CLI cannot do: it derives
      # the PR base itself, and it verifies the binary's signature. `version` is
      # omitted so it installs the spec pinned in package.json — CI and
      # .githooks then run the same build.
      #
      # Its `comment`, `review-comments` and `sarif` outputs stay off. Each
      # wants `pull-requests: write`, `checks: write` or `security-events: write`
      # on a job that installs and runs pull-request-authored code, and a failing
      # gate with the findings in its log is already the whole signal.
      #
      # A PR is scoped to the files it changed and fails only on findings it
      # introduces. A push to main runs the whole project, because the scoped
      # audit passes on a config edit that strands a file elsewhere.
      #
      # Runs after the setup step's `dev:prepare`: without `dist/` the tsconfig
      # chain does not resolve and fallow sees a different module graph.
      - name: Quality (fallow)
        if: ${{ !cancelled() }}
        uses: fallow-rs/fallow@79a0e8d8dbcaa408dce348b3df14fc1e824f988b # v3 (3.22.0)
        with:
          command: ${{ github.event_name == 'pull_request' && 'audit' || '' }}

      # A separate surface: fallow keeps security candidates out of both the
      # default run and the audit gate, so neither would ever report one.
      # `auto-changed-since: false` because a candidate on an untouched file
      # should still block — the scan costs ~0.14s and the repo is at zero, so
      # there is no backlog worth grandfathering.
      - name: Security candidates (fallow)
        if: ${{ !cancelled() }}
        uses: fallow-rs/fallow@79a0e8d8dbcaa408dce348b3df14fc1e824f988b # v3 (3.22.0)
        with:
          command: security
          auto-changed-since: false

  test:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the module does real path work
        # (alias maps, watcher path normalization) — the class of bug that only
        # ships to Windows users.
        os: [ubuntu-latest, windows-latest]
        # The project tracks the current LTS via the `lts` tag, so it follows new
        # LTS lines without a manual bump. `lts/-1` is not an option: engines.node
        # is >=24.11.0, which is above it.
        node: [lts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `full`, not `lib`: test/unit/upstream-baselines.test.ts imports
      # website/app/utils/upstream-baselines.ts, and oxc resolves that file
      # through website/.nuxt/tsconfig.app.json — which only `nuxt prepare
      # website` generates.
      - uses: $/.github/actions/setup
        with:
          runtime: node@${{ matrix.node }}
          prepare: full

      - name: Test
        run: pnpm run test:coverage

      # Handed to the `coverage` job, which holds the upload credential. This job
      # runs PR-authored code, so it must never hold one itself.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/
            test-report.junit.xml
          retention-days: 1
          if-no-files-found: error

  # Full-app end-to-end: builds the fixture apps with @nuxt/test-utils/e2e and
  # exercises the module against a real Nitro server (SSR data, auto-imports,
  # CSP headers, the Better Auth proxy).
  e2e:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Audit-mode egress monitoring. Applied to the jobs that build and run
      # PR-authored code against the network, not to every job — harden-runner is
      # itself a third-party action, so it is worth its surface where there is
      # untrusted code and outbound traffic to observe, and not elsewhere.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      - name: End-to-end tests
        run: pnpm run test:e2e

  # Publishable-package gate: build the real tarball (`pnpm pack` rewrites
  # `catalog:` ranges exactly like `pnpm publish`), lint its shape, then install
  # it into the minimal example with plain npm — the consumer path
  # (registry-shaped install, lifecycle scripts, engines) that repo-internal jobs
  # never exercise.
  pack:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      # Runs `prepack` (the full build) and produces the exact artifact a release
      # would publish.
      - name: Pack
        run: pnpm pack

      # publint, attw and the contents assertions, defined once in
      # scripts/check-tarball.mjs and run identically by release.yml's build job.
      - name: Check the tarball
        if: ${{ !cancelled() }}
        run: pnpm run check:tarball

      - name: Consumer smoke test (npm install + build)
        if: ${{ !cancelled() }}
        env:
          NUXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
        # Lockfile-less install on purpose: simulates a fresh consumer. `npm`
        # comes from the runner image — pnpm's Node runtime deliberately ships
        # without the bundled npm/npx (pnpm 11+), and a stock runner npm is
        # exactly the consumer path this job is meant to exercise.
        #
        # The npm the image bundles (10.9.x, from its own Node 22) crashes in
        # Arborist's peer-set resolution on any Nuxt 4 tree — `Cannot read
        # properties of null (reading 'edgesOut')`, npm/cli#9787, fixed in npm
        # 11.6.0. Nothing to do with this package: a bare `npm install` of the
        # example hits it too. So the consumer npm is pinned, which also keeps
        # the gate reproducible when the runner image moves.
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-convex-module-*.tgz)"
          SMOKE="$RUNNER_TEMP/smoke"
          cp -R examples/minimal "$SMOKE"
          cd "$SMOKE"
          npx --yes npm@11.17.0 install --no-audit --no-fund "$TARBALL"
          npx --yes npm@11.17.0 run build

      # The consumer path checks that the tarball INSTALLS and BUILDS. This
      # checks that its declarations compile — the question `vue-tsc` on the
      # sources and `attw` on the resolution both leave unanswered, and the one
      # that matters most for a package whose product is its types.
      - name: Consumer type check (built package)
        if: ${{ !cancelled() }}
        run: pnpm run check:consumer-types "$RUNNER_TEMP/smoke"

      # Verifies the registry signature and provenance attestation of every
      # dependency the smoke install pulled. pnpm's `trustPolicy: no-downgrade`
      # refuses a package whose trust evidence weakens between versions; this
      # checks that the evidence actually validates, on the consumer's npm path.
      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke
        run: npx --yes npm@11.17.0 audit signatures # zizmor: ignore[adhoc-packages]

  # The docs site holds the only in-repo Vue call sites of the public
  # composables — `useAsyncQuery`, `useMutation`, the Better Auth components —
  # so it is the only place a change to their types is checked against real
  # usage rather than against tests written alongside them.
  #
  # Type-check only, no `nuxt build`. That command prints "Build complete!" and
  # then does not exit (measured: alive minutes later on a finished build), so a
  # CI step running it would hang until the job timeout and report a failure
  # that says nothing. The production build is Vercel's, which deploys a preview
  # on every pull request and reports its own check — deliberately outside this
  # aggregate, like every other third-party service here.
  website:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      # `nuxt typecheck` prepares the site itself, so `lib` above is enough:
      # the module needs its stub and types built, nothing more.
      - name: Type check the docs site
        run: pnpm exec nuxt typecheck website

  # Inspects the dependency delta a PR introduces and fails on a known CVE or a
  # package GitHub has flagged as malicious. Complements pnpm's cooldown, which
  # only delays a new version — it never looks at what's inside it. PR-only: the
  # action diffs two commits, so there is nothing to review on a push. No install
  # here, so no PR-authored code runs in this job.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The only job that holds the coverage upload credential. It downloads an
  # artifact and installs nothing, so PR-authored code never runs next to it.
  coverage:
    needs: test
    # Skipped along with `test` — there would be no artifact to upload. Not
    # `!cancelled()` alone, or a skipped `test` leaves this job downloading an
    # artifact that was never produced and failing for a second, confusing reason.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov over OIDC instead of a stored token. This is the only job in the
      # repository that may hold `id-token: write`, and the reason it exists as
      # its own job: it downloads an artifact and installs nothing, so no
      # PR-authored code ever runs beside the credential.
      id-token: write
    steps:
      # Codecov maps coverage paths against the repository, so the tree has to be
      # present — but nothing here is installed or executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          slug: qruto/nuxt-convex-module
          disable_search: true
          files: coverage/lcov.info

      # Run times, failure and flaky detection. Runs even when tests fail so
      # failures are captured.
      #
      # The same action as above with `report_type: test_results`, not
      # `codecov/test-results-action` — that one now prints a deprecation notice
      # telling you to do exactly this, and it still targets Node 20, which the
      # runners are already force-upgrading.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          report_type: test_results
          slug: qruto/nuxt-convex-module
          disable_search: true
          files: test-report.junit.xml

  # The single required status check, and the only context the branch ruleset
  # names. Every job above is aggregated here, so adding, renaming or splitting
  # one never means touching the ruleset again. `skipped` counts as a pass —
  # `dependency-review` is skipped on pushes, and `test`/`e2e`/`pack` are skipped
  # on a change that touches no source.
  all-checks:
    name: All checks passed
    if: ${{ always() }}
    # `coverage` is deliberately absent: Codecov is a reporting service, and a
    # third party's outage must not block a merge. The coverage *thresholds* are
    # enforced by vitest inside `test`, which is aggregated here.
    needs:
      - changes
      - static
      - test
      - e2e
      - pack
      - website
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled)
                echo "::error::A required job did not pass: $result"
                exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
