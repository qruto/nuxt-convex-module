name: ci

# Every job is two steps: checkout, then `pnpm/setup` — one action that
# installs pnpm (version pinned by `packageManager` in package.json), downloads
# the Node LTS runtime through it (`pnpm runtime`, so no actions/setup-node),
# restores the pnpm store cache, and runs `pnpm install` — which pnpm switches
# to frozen-lockfile mode automatically because CI is set.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      - name: Lint
        run: pnpm run lint

  # Enforce Conventional Commits on PRs. The local commit-msg hook gives fast
  # feedback but can be bypassed with --no-verify, so this is the gate that
  # actually keeps the history clean. Pushes to main are skipped — those commits
  # were already linted on their PR.
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so commitlint can read every commit in the PR range.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      - name: Lint PR commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  # Inspects the dependency delta a PR introduces and fails on a known CVE or a
  # package GitHub has flagged as malicious. Complements pnpm's cooldown, which
  # only delays a new version — it never looks at what's inside it. PR-only:
  # the action diffs two commits, so there is nothing to review on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      # Type-checks the published surface (module + Convex code). The website app
      # typecheck is intentionally excluded — it imports the app's
      # `convex/_generated` code, which only exists with a Convex deployment.
      - name: Type check
        run: pnpm run test:types:lib

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the module does real path work
        # (alias maps, watcher path normalization) — the class of bug that
        # only ships to Windows users.
        os: [ubuntu-latest, windows-latest]
        # The project tracks the current LTS everywhere via the `lts` tag, so it
        # follows new LTS lines without manual bumps. Kept as a matrix so an
        # extra line can be slotted in later without restructuring.
        node: [lts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Test
        run: pnpm run test:coverage

      # Upload coverage once (from the ubuntu lts leg) to keep the Codecov badge fed.
      - name: Upload coverage to Codecov
        if: matrix.node == 'lts' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Upload test results (run times, failure/flaky detection) to Codecov Test
      # Analytics. Runs even when tests fail so failures are captured.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node == 'lts' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./test-report.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Full-app end-to-end: builds the fixture apps with @nuxt/test-utils/e2e and
  # exercises the module against a real Nitro server (SSR data, auto-imports,
  # CSP headers, the Better Auth proxy). Separate job so the unit/coverage
  # feedback loop stays fast.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      - name: Prepare
        run: pnpm run dev:prepare

      - name: End-to-end tests
        run: pnpm run test:e2e

  # Drift gates: fallow (dead code / duplication / health) and the committed
  # TypeDoc API reference — regenerating it must produce no diff, otherwise
  # source doc-comments and the published reference have diverged.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      - name: Quality (fallow)
        run: pnpm run test:quality

      # No `dev:prepare` needed: TypeDoc runs on the standalone
      # tsconfig.typedoc.json with `skipErrorChecking`.
      - name: API reference drift
        run: |
          pnpm run docs:api
          git diff --exit-code -- website/content/4.api-reference

      # Static analysis of the workflows themselves (template injection,
      # unpinned actions, credential persistence, …). Accepted findings live
      # in .github/zizmor.yml.
      - name: Workflow lint (zizmor)
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false

  # Publishable-package gate: build the real tarball (`pnpm pack` rewrites
  # `catalog:` ranges exactly like `pnpm publish`), lint its shape, then
  # install it into the minimal example with plain npm — the consumer path
  # (registry-shaped install, lifecycle scripts, engines) that repo-internal
  # jobs never exercise.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm, node & dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@lts
          cache: true

      # Generates `.nuxt/tsconfig.json`, which the root tsconfig extends. Without
      # it, `nuxt-module-build` can't resolve compiler options and prepack fails.
      - name: Prepare
        run: pnpm run dev:prepare

      # Runs `prepack` (the full build) and produces the exact artifact a
      # release would publish.
      - name: Pack
        run: pnpm pack

      - name: Package shape (publint)
        run: pnpm exec publint run ./nuxt-convex-module-*.tgz

      # internal-resolution-error is ignored because `#convex/auth-client` in
      # the Better Auth runtime types is a Nuxt alias for the app's own auth
      # client, resolved at app build time — unresolvable outside a Nuxt app
      # by design. Real resolution regressions surface in the smoke test below.
      - name: Type resolution (arethetypeswrong)
        run: pnpm exec attw ./nuxt-convex-module-*.tgz --profile esm-only --ignore-rules internal-resolution-error

      - name: Consumer smoke test (npm install + build)
        env:
          NUXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
        # Lockfile-less install on purpose: simulates a fresh consumer. `npm`
        # comes from the runner image — pnpm's Node runtime deliberately ships
        # without the bundled npm/npx (pnpm 11+), and a stock runner npm is
        # exactly the consumer path this job is meant to exercise.
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-convex-module-*.tgz)"
          SMOKE="$RUNNER_TEMP/smoke"
          cp -R examples/minimal "$SMOKE"
          cd "$SMOKE"
          npm install --no-audit --no-fund "$TARBALL"
          npm run build
