name: ci

# Every per-commit gate lives here, in one file, so `ci-ok` can aggregate them
# and there is one place to read the gate set.
#
# Irrelevant work is skipped per JOB, never per workflow. A workflow-level
# `paths:`/`paths-ignore:` filter stops the run entirely, so the required check
# never reports at all — and GitHub shows "Expected — waiting for status"
# forever, with nothing to re-run. Job-level `if:` gets the same saving safely:
# the run still happens, the expensive jobs report `skipped`, and the aggregate
# gate counts `skipped` as a pass.
#
# Setup is defined once, in .github/actions/setup — that is where the pnpm
# version, the Node runtime and their action pin live.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Nothing by default — every job declares the minimum it needs.
permissions: {}

jobs:
  # Which of the expensive jobs this change actually needs. On a push to main
  # everything runs regardless — the cost is one run per merge, and a green main
  # is worth more than the minutes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'examples/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'build.config.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # Everything that needs a checkout, an install and nothing else. One job rather
  # than four: the setup is identical, and `if: !cancelled()` still gives a
  # per-gate verdict, so one push surfaces every problem at once instead of
  # stopping at the first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: commitlint reads the PR range and `fallow audit` diffs
          # against the PR base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      # Type-checks the published surface (module + Convex code). The website and
      # DevTools apps are checked by their own gates; the root tsconfig excludes
      # them.
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      # Enforce Conventional Commits on PRs. The local commit-msg hook gives fast
      # feedback but can be bypassed with --no-verify, so this is the gate that
      # actually keeps the history clean. Pushes to main are skipped — those
      # commits were already linted on their PR.
      - name: Commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run lint:commits --from "$BASE_SHA" --to "$HEAD_SHA"

      # Dead code, unused exports/deps, duplication, complexity — through the
      # official action, which the bare CLI cannot replace: it derives the PR
      # base itself, posts the findings as a sticky comment and inline review
      # comments, and can upload SARIF. `version` is omitted on purpose, so it
      # installs the release matching the `fallow` spec in package.json — pinned
      # there exactly, so CI and .githooks run the same build.
      #
      # A PR is scoped to the files it changed and fails only on findings it
      # introduces. A push to main runs the whole project instead, because the
      # scoped audit passes on a config edit that strands a file elsewhere.
      #
      # This runs after the setup step's `dev:prepare`, unlike the arrangement it
      # replaces: without `dist/` the tsconfig chain does not resolve and fallow
      # reports against a different module graph than the one developers see.
      - name: Quality (fallow)
        if: ${{ !cancelled() }}
        uses: fallow-rs/fallow@79a0e8d8dbcaa408dce348b3df14fc1e824f988b # v3 (3.22.0)
        with:
          command: ${{ github.event_name == 'pull_request' && 'audit' || '' }}

      # A separate surface: fallow keeps security candidates out of both the
      # default run and the audit gate, so neither would ever report one.
      # `auto-changed-since: false` because a candidate on an untouched file
      # should still block — the scan costs ~0.14s and the repo is at zero, so
      # there is no backlog worth grandfathering.
      - name: Security candidates (fallow)
        if: ${{ !cancelled() }}
        uses: fallow-rs/fallow@79a0e8d8dbcaa408dce348b3df14fc1e824f988b # v3 (3.22.0)
        with:
          command: security
          auto-changed-since: false

      # Regenerating the committed TypeDoc reference must produce no diff,
      # otherwise source doc-comments and the published reference have diverged.
      - name: API reference drift
        if: ${{ !cancelled() }}
        run: pnpm run docs:api:check

      # Static analysis of the workflows themselves (template injection,
      # credential persistence, unpinned uses). Accepted findings live in
      # .github/zizmor.yml.
      # The action's `version` input defaults to `latest`, which makes zizmor an
      # unpinned input in a repository that pins every action to a digest: a new
      # release can add an audit and redden CI with no change here. Pin it, and
      # bump deliberately — that is when you read the new findings.
      - name: Workflow lint (zizmor)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: 1.30.0
          advanced-security: false

  test:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the module does real path work
        # (alias maps, watcher path normalization) — the class of bug that only
        # ships to Windows users.
        os: [ubuntu-latest, windows-latest]
        # The project tracks the current LTS via the `lts` tag, so it follows new
        # LTS lines without a manual bump. `lts/-1` is not an option: engines.node
        # is >=24.11.0, which is above it.
        node: [lts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `full`, not `lib`: test/unit/upstream-baselines.test.ts imports
      # website/app/utils/upstream-baselines.ts, and oxc resolves that file
      # through website/.nuxt/tsconfig.app.json — which only `nuxt prepare
      # website` generates.
      - uses: $/.github/actions/setup
        with:
          runtime: node@${{ matrix.node }}
          prepare: full

      - name: Test
        run: pnpm run test:coverage

      # Handed to the `coverage` job, which holds the upload credential. This job
      # runs PR-authored code, so it must never hold one itself.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/
            test-report.junit.xml
          retention-days: 1
          if-no-files-found: error

  # Full-app end-to-end: builds the fixture apps with @nuxt/test-utils/e2e and
  # exercises the module against a real Nitro server (SSR data, auto-imports,
  # CSP headers, the Better Auth proxy).
  e2e:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Audit-mode egress monitoring. Applied to the jobs that build and run
      # PR-authored code against the network, not to every job — harden-runner is
      # itself a third-party action, so it is worth its surface where there is
      # untrusted code and outbound traffic to observe, and not elsewhere.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      - name: End-to-end tests
        run: pnpm run test:e2e

  # Publishable-package gate: build the real tarball (`pnpm pack` rewrites
  # `catalog:` ranges exactly like `pnpm publish`), lint its shape, then install
  # it into the minimal example with plain npm — the consumer path
  # (registry-shaped install, lifecycle scripts, engines) that repo-internal jobs
  # never exercise.
  pack:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          prepare: lib

      # Runs `prepack` (the full build) and produces the exact artifact a release
      # would publish.
      - name: Pack
        run: pnpm pack

      # publint, attw and the contents assertions, defined once in
      # scripts/check-tarball.mjs and run identically by release.yml's build job.
      - name: Check the tarball
        if: ${{ !cancelled() }}
        run: pnpm run check:tarball

      - name: Consumer smoke test (npm install + build)
        if: ${{ !cancelled() }}
        env:
          NUXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
        # Lockfile-less install on purpose: simulates a fresh consumer. `npm`
        # comes from the runner image — pnpm's Node runtime deliberately ships
        # without the bundled npm/npx (pnpm 11+), and a stock runner npm is
        # exactly the consumer path this job is meant to exercise.
        #
        # The npm the image bundles (10.9.x, from its own Node 22) crashes in
        # Arborist's peer-set resolution on any Nuxt 4 tree — `Cannot read
        # properties of null (reading 'edgesOut')`, npm/cli#9787, fixed in npm
        # 11.6.0. Nothing to do with this package: a bare `npm install` of the
        # example hits it too. So the consumer npm is pinned, which also keeps
        # the gate reproducible when the runner image moves.
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-convex-module-*.tgz)"
          SMOKE="$RUNNER_TEMP/smoke"
          cp -R examples/minimal "$SMOKE"
          cd "$SMOKE"
          npx --yes npm@11.17.0 install --no-audit --no-fund "$TARBALL"
          npx --yes npm@11.17.0 run build

      # Verifies the registry signature and provenance attestation of every
      # dependency the smoke install pulled. pnpm's `trustPolicy: no-downgrade`
      # refuses a package whose trust evidence weakens between versions; this
      # checks that the evidence actually validates, on the consumer's npm path.
      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke
        run: npx --yes npm@11.17.0 audit signatures # zizmor: ignore[adhoc-packages]

  # Inspects the dependency delta a PR introduces and fails on a known CVE or a
  # package GitHub has flagged as malicious. Complements pnpm's cooldown, which
  # only delays a new version — it never looks at what's inside it. PR-only: the
  # action diffs two commits, so there is nothing to review on a push. No install
  # here, so no PR-authored code runs in this job.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The only job that holds the coverage upload credential. It downloads an
  # artifact and installs nothing, so PR-authored code never runs next to it.
  coverage:
    needs: test
    # Skipped along with `test` — there would be no artifact to upload. Not
    # `!cancelled()` alone, or a skipped `test` leaves this job downloading an
    # artifact that was never produced and failing for a second, confusing reason.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Codecov maps coverage paths against the repository, so the tree has to be
      # present — but nothing here is installed or executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: qruto/nuxt-convex-module
          disable_search: true
          files: coverage/lcov.info

      # Run times, failure and flaky detection. Runs even when tests fail so
      # failures are captured.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: test-report.junit.xml

  # The single required status check, and the only context the branch ruleset
  # names. Every job above is aggregated here, so adding, renaming or splitting
  # one never means touching the ruleset again. `skipped` counts as a pass —
  # `dependency-review` is skipped on pushes, and `test`/`e2e`/`pack` are skipped
  # on a change that touches no source.
  all-checks:
    name: All checks passed
    if: ${{ always() }}
    # `coverage` is deliberately absent: Codecov is a reporting service, and a
    # third party's outage must not block a merge. The coverage *thresholds* are
    # enforced by vitest inside `test`, which is aggregated here.
    needs:
      - changes
      - static
      - test
      - e2e
      - pack
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled)
                echo "::error::A required job did not pass: $result"
                exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
