name: CI

# Every check that runs on a commit lives here, so there is one file to read and
# one job (`All checks passed`) that reports them all.
#
# Work is skipped per JOB, never per workflow. A workflow-level `paths:` filter
# stops the whole run, so the required check never reports at all: GitHub shows
# "Expected — waiting for status" forever, with nothing to re-run. A job-level
# `if:` saves the same minutes safely — the run happens, expensive jobs report
# `skipped`, and the aggregate counts `skipped` as a pass.
#
# The pnpm version, the Node runtime and their action pins are defined once, in
# .github/actions/setup.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly, and by hand from the Actions tab (say, right before a release): the
  # same checks on main with nothing changed here, so a new Nuxt or Convex
  # release that breaks a fresh app shows up without waiting for a pull
  # request. The consumer smoke tests in `pack` install the newest of each.
  schedule:
    - cron: '41 5 * * 1' # Mondays
  workflow_dispatch:

# Cancel superseded runs on a pull request, never on main. `head_ref` is empty on
# a push, so cancelling there would put every merge in one group, and two merges
# in quick succession would kill the first run. `Release` will not tag a commit
# whose ci run was cancelled, so that commit could never be released.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default. Each job asks for what it needs.
permissions: {}

jobs:
  # Works out which of the expensive jobs a pull request needs. Anywhere else —
  # a push to main, the weekly run, a run by hand — they all run anyway: that
  # costs one full run per merge, and a green main is worth the minutes.
  #
  # `ubuntu-slim` is one vCPU in a container: enough for a job that calls an
  # API or runs a few lines of shell, on a quarter of the machine
  # `ubuntu-latest` takes. The other jobs that only do that use it too.
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      # No checkout: on a pull request the filter reads the changed files
      # through the REST API, and anywhere else it does not run.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - '.nuxtrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              # The DevTools panel ships with the package: `build` generates
              # it into dist/devtools-client, which `files: ["dist"]`
              # publishes. Leave it out here and a change to the panel skips
              # `pack`, which is the job that checks the panel has any built
              # assets at all.
              - 'devtools-client-app/**'
              - 'test/**'
              # Website code that test/unit imports.
              - 'website/shared/**'
              - 'website/app/utils/upstream-baselines.ts'
              - 'scripts/**'
              - 'examples/**'
              - 'templates/**'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'build.config.ts'

  # Everything that needs a checkout and an install and nothing more. One job
  # rather than four, because the setup is identical. `if: !cancelled()` on each
  # step means one push reports every problem instead of stopping at the first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because commitlint reads the PR's commit range and
          # `fallow audit` diffs against the PR base.
          fetch-depth: 0
          persist-credentials: false

      # Saves the Linux `node@lts` store on main, the one `pack` and Preview
      # restore too. This job runs on every merge, docs-only ones included.
      - uses: ./.github/actions/setup
        with:
          prepare: lib
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      # Type-checks what gets published: the module and its Convex code. The
      # website gets the next step, `pack` builds the DevTools app, and the
      # root tsconfig excludes both.
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      # The docs site is the only place in this repository that calls the public
      # composables from real Vue components — `useAsyncQuery`, `useMutation`,
      # the Better Auth components. So it is the only check of their types
      # against real usage rather than against tests written next to them.
      #
      # Type-check only, no `nuxt build`. That command prints "Build complete!"
      # and then never exits (measured: still alive minutes after finishing), so
      # a step running it would hang until the timeout and fail for no useful
      # reason. Vercel does the production build and reports its own check,
      # outside this aggregate like every other third-party service.
      #
      # `nuxt typecheck` prepares the site itself, so the `lib` setup above is
      # enough. It used to be a job of its own, which spent most of its minute
      # on setup.
      - name: Type check the docs site
        if: ${{ !cancelled() }}
        run: pnpm exec nuxt typecheck website

      # Conventional Commits, on pull requests only. The local commit-msg hook
      # is faster, but `--no-verify` skips it, so this is the check that holds.
      # Pushes to main are skipped: those commits were checked on their PR.
      - name: Commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run lint:commits --from "$BASE_SHA" --to "$HEAD_SHA"

      # Compares what package.json promises against what is installed: that our
      # `engines` is not stricter than a dependency's own, and that no peer range
      # is wider than what that peer actually accepts.
      #
      # Nothing else checks this. publint reads the manifest's shape, attw
      # resolves its types, fallow reads the module graph. None of them compares
      # a declared range to reality. This caught `convex: ">=1.40.0"`, which
      # promised support for a convex 2.x that both optional add-ons rule out.
      #
      # `--no-workspaces` skips the website and DevTools apps, which are private
      # and promise nobody anything. `-d` skips devDependencies, which are ours
      # alone.
      - name: Manifest ranges (installed-check)
        if: ${{ !cancelled() }}
        run: pnpm run check:manifest

      # Regenerating the TypeDoc reference must produce no diff. A diff means
      # the doc comments in the source and the published reference disagree.
      - name: API reference drift
        if: ${{ !cancelled() }}
        run: pnpm run docs:api:check

      # The hand-written docs against the code: every module option, runtime
      # config key, auto-import, component, subpath and printed message has to
      # be documented, and everything the docs name has to exist. Here rather
      # than in `test`, which a docs-only change skips.
      - name: Docs contract
        if: ${{ !cancelled() }}
        run: pnpm run test:docs

      # Security analysis of the workflow files: template injection, credentials
      # left on disk, unpinned actions. Accepted findings live in
      # .github/zizmor.yml.
      #
      # `version` is pinned because it defaults to `latest`, and a new zizmor
      # release can add a rule that fails CI with nothing changed here. Bump it
      # deliberately, and read the new findings then.
      - name: Workflow lint (zizmor)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.0
          advanced-security: false

      # Correctness of the workflow files, which zizmor does not look at: bad
      # expressions, `needs`/matrix references that do not exist, invalid runner
      # labels, malformed cron. It also runs shellcheck over every inline `run:`
      # block (ubuntu-latest ships shellcheck, and actionlint finds it on PATH).
      #
      # Pinned for the same reason as zizmor. Accepted findings live in
      # .github/actionlint.yaml.
      - name: Workflow correctness (actionlint)
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

      # Misspellings in prose, comments, identifiers and workflow files.
      # Settings and the accepted-word list are in _typos.toml, including the
      # `.git/` exclusion — without it, the `fetch-depth: 0` above makes typos
      # report on old commit subjects.
      - name: Spelling (typos)
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      # Dead code, unused exports and dependencies, duplication, complexity.
      # The same commands the git hooks run, from the lockfile's copy of fallow:
      # package.json pins it exactly, so CI runs the same build as .githooks,
      # under Dependabot, the cooldown and pnpm's trust policy. Its npm wrapper
      # checks the binary's Ed25519 signature and SHA-256 digest before running
      # it, and refuses to run a binary that fails the check.
      #
      # On a pull request it looks only at the changed files, and fails on any
      # finding in them (`audit.gate` in .fallowrc.jsonc). The base is the PR's,
      # which the full-history checkout above already has. On a push to main it
      # runs over everything, because a scoped audit passes on a config edit
      # that strands a file elsewhere.
      #
      # Not through the fallow-rs/fallow action. It wrapped ~2 s of analysis in
      # ~40 s of cache steps, and the CLI now does both things it was here for:
      # finding the PR base and verifying the binary.
      #
      # Must run after the setup step's `dev:prepare`: without `dist/` the
      # tsconfig chain does not resolve and fallow sees a different module
      # graph.
      - name: Quality (fallow)
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            pnpm exec fallow audit --base "$BASE_SHA"
          else
            pnpm run test:quality
          fi

      # A separate command, because fallow keeps security candidates out of
      # both the default run and the audit gate — neither would ever report one.
      # It scans the whole project, so a candidate in an untouched file still
      # fails the job. The scan takes ~0.14s and the repo is at zero findings,
      # so there is no backlog to grandfather in.
      - name: Security candidates (fallow)
        if: ${{ !cancelled() }}
        run: pnpm run test:security

  # The unit tests on both legs. The Linux leg also runs the end-to-end suite,
  # which builds the fixture apps with @nuxt/test-utils/e2e and runs the module
  # against a real Nitro server — SSR data, auto-imports, CSP headers, the
  # Better Auth proxy. It shares this job's install rather than paying for one
  # of its own, which took longer than the suite.
  test:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.src == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node that `engines` allows, so nothing newer slips into
          # the module unnoticed. On Linux, where the end-to-end suite runs too,
          # so the floor also gets real Nitro builds and SSR.
          - os: ubuntu-latest
            node: engines
          # Windows is here because the module does real path work — alias maps,
          # watcher path normalization — and those bugs only reach Windows users.
          # `lts` tracks the newest LTS line, so a new one needs no bump here.
          - os: windows-latest
            node: lts
    steps:
      # Records what the job talks to over the network, without blocking it.
      # Only where code from the pull request is built and run with network
      # access: harden-runner is itself a third-party action, so it is worth
      # adding where there is untrusted code to watch, and nowhere else. Here
      # that is the Linux leg, which builds and serves the e2e fixtures.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read from package.json, so the floor tested is always the one
      # published: `>=24.11.0` becomes `node@24.11.0`. pnpm takes an exact
      # version. Anything but a plain `>=x.y.z` fails here, because pnpm would
      # resolve a range to its newest match and quietly test something else.
      - name: Read the Node floor
        id: floor
        if: matrix.node == 'engines'
        run: |
          floor=$(jq -r '.engines.node | ltrimstr(">=")' package.json)
          if ! [[ $floor =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::engines.node is not a plain '>=x.y.z' floor; teach this step to read it."
            exit 1
          fi
          echo "runtime=node@$floor" >> "$GITHUB_OUTPUT"

      # `full`, not `lib`: test/unit/upstream-baselines.test.ts imports a file
      # from website/, which oxc resolves through
      # website/.nuxt/tsconfig.app.json — and only `nuxt prepare website`
      # generates that.
      #
      # Each leg saves its own store on main, because each runs its own runtime.
      - uses: ./.github/actions/setup
        with:
          runtime: ${{ steps.floor.outputs.runtime || format('node@{0}', matrix.node) }}
          prepare: full
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: pnpm run test:coverage

      # Handed to the `coverage` job, which holds the upload credential. This
      # job runs code from the pull request, so it must never hold one itself.
      # Uploaded before the end-to-end tests, because their run writes its own
      # test-report.junit.xml over the unit tests' one.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            test-report.junit.xml
          retention-days: 1
          if-no-files-found: error

      # test/e2e/hydration.test.ts boots the client bundle in a real browser.
      # Chromium comes from playwright-core's own installer, pinned by the
      # lockfile's playwright-core version; `--with-deps` adds the system
      # libraries the runner image lacks. `--only-shell`, because
      # @nuxt/test-utils launches headless with no `channel`, which runs
      # Chromium's headless shell: the full browser would be downloaded and
      # never started. Not cached, as Playwright's CI guide advises: restoring
      # takes about as long as downloading.
      #
      # This step and the next carry `!cancelled()`, so a unit-test failure
      # does not hide an end-to-end one: one push reports both.
      - name: Install Chromium
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - name: End-to-end tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pnpm run test:e2e

  # Checks the package a consumer would actually get. Builds the real tarball
  # (`pnpm pack` rewrites `catalog:` ranges exactly like `pnpm publish` does),
  # checks its shape, then installs it into the starter template with plain npm.
  # That last part — a registry-style install, lifecycle scripts, engines — is
  # what no other job here exercises.
  pack:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          prepare: lib

      # Runs `prepack` (the full build) and produces the exact artifact a release
      # would publish.
      - name: Pack
        run: pnpm pack

      # publint, attw and the content checks. Defined once in
      # scripts/check-tarball.mjs, and release.yml's build job runs the same
      # script.
      - name: Check the tarball
        if: ${{ !cancelled() }}
        run: pnpm run check:tarball

      # Every consumer install at once: the three npm apps (install, build,
      # serve) and the pnpm installs, each a background job with its own log and,
      # for a server, its own port. One after another they took ~145 s; side by
      # side they take about as long as the slowest app. Each log is printed
      # whole, in a group of its own, once all of them are done, so nothing
      # interleaves and an `::error::` still becomes an annotation. Background
      # jobs rather than GitHub's parallel steps, which actionlint cannot parse
      # yet: muting it would also lose shellcheck on this script.
      #
      # The npm apps. No lockfile, on purpose: this is what a new user gets,
      # newest Nuxt included — the repository's own lockfile pins Nuxt, so this
      # is where a new Nuxt release meets the module first. `npm` comes from
      # the runner image, because pnpm's Node runtime ships without npm and npx
      # from pnpm 11 on — and a stock npm is exactly the path being tested.
      #
      # The version pin is a workaround. The image's own npm (10.9.x) crashes
      # while resolving peers on any Nuxt 4 tree: `Cannot read properties of
      # null (reading 'edgesOut')`, npm/cli#9787, fixed in 11.6.0. It is not
      # about this package — a bare `npm install` of the example hits it too.
      # Pinning also keeps this job reproducible when the runner image moves.
      #
      # Building is not enough: on Nuxt 4.6, `build` succeeded and the built
      # server then failed every request (ERR_MODULE_NOT_FOUND). So each app
      # is served and asked for its home page, which has to render although
      # nothing answers at the placeholder deployment URL.
      #
      # The pnpm installs. pnpm 11 and later stop an install at the first build
      # script nobody has approved or denied, and `create nuxt` 3.x reports that
      # stop as a canceled scaffold. Each app's `.pnpmfile.mjs` answers for the
      # scripts the app and Nuxt's official modules bring; this fails when a new
      # dependency brings another. No lockfile, as above.
      - name: Consumer smoke tests (npm and pnpm)
        if: ${{ !cancelled() }}
        env:
          NUXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-convex-module-*.tgz)"
          npm() { npx --yes npm@11.17.0 "$@"; }

          # Install, build, serve on <port>, and ask for the home page.
          smoke_npm() {
            local app=$1 port=$2 dir server code
            dir="$RUNNER_TEMP/smoke-$(basename "$app")"
            cp -R "$app" "$dir" && cd "$dir" || return 1
            npm install --no-audit --no-fund "$TARBALL" && npm run build || return 1
            PORT=$port node .output/server/index.mjs > server.log 2>&1 &
            server=$!
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 30 --retry-connrefused --retry-delay 1 "http://localhost:$port/" || true)
            kill "$server" 2> /dev/null || true
            wait "$server" || true
            if [ "$code" != 200 ] || grep -q 'Cannot find module' server.log; then
              echo "::error::The built $(basename "$dir") answered HTTP $code"
              cat server.log
              return 1
            fi
          }

          smoke_pnpm() {
            local app dir
            for app in templates/starter examples/playground; do
              dir="$RUNNER_TEMP/smoke-pnpm-$(basename "$app")"
              cp -R "$app" "$dir" && (cd "$dir" && pnpm add "$TARBALL") || return 1
            done
            # The official modules `create nuxt` offers, and the better-sqlite3
            # that @nuxt/content installs on its first run.
            (cd "$RUNNER_TEMP/smoke-pnpm-starter" && pnpm add @nuxt/a11y \
              @nuxt/content @nuxt/eslint @nuxt/fonts @nuxt/hints @nuxt/icon \
              @nuxt/image @nuxt/scripts @nuxt/test-utils @nuxt/ui better-sqlite3)
          }

          # npx installs npm 11.17.0 into its cache on first use. Do that once
          # here, rather than have three npx calls race to do it.
          npm --version > /dev/null

          # start <name> <command...>: run it in the background, logging to
          # $RUNNER_TEMP/<name>.log.
          names=() pids=()
          start() {
            names+=("$1")
            "${@:2}" > "$RUNNER_TEMP/$1.log" 2>&1 &
            pids+=("$!")
          }
          # `templates/starter` is what `create nuxt` hands a new user,
          # `examples/playground` is the StackBlitz template pkg.pr.new ships —
          # and nothing else ever builds it (pkg.pr.new only uploads the
          # directory). Neither uses an integration, so
          # `test/fixtures/integrations` turns on every one at its peer range,
          # with placeholder keys: an upstream break that only shows with
          # Better Auth, Polar, Clerk, Auth0 or nuxt-security fails here.
          start starter smoke_npm templates/starter 3000
          start playground smoke_npm examples/playground 3001
          start integrations smoke_npm test/fixtures/integrations 3002
          start pnpm smoke_pnpm

          failed=''
          for i in "${!names[@]}"; do
            wait "${pids[i]}" || failed="$failed ${names[i]}"
            echo "::group::${names[i]}"
            cat "$RUNNER_TEMP/${names[i]}.log"
            echo '::endgroup::'
          done
          if [ -n "$failed" ]; then
            echo "::error::Consumer smoke tests failed:$failed"
            exit 1
          fi

      # The step above proves the tarball installs and builds. This one proves
      # its type declarations compile inside an app. `vue-tsc` checks the
      # sources and `attw` checks that the types resolve; neither answers this,
      # and this package's product is its types.
      - name: Consumer type check (built package)
        if: ${{ !cancelled() }}
        run: pnpm run check:consumer-types "$RUNNER_TEMP/smoke-starter"

      # Checks the registry signature and provenance of every dependency the
      # integrations app pulled in. Its tree is the starter's plus every
      # integration's, so this covers what a new user installs and what each
      # add-on brings. pnpm's `trustPolicy: no-downgrade` refuses a package
      # whose evidence gets weaker between versions; this checks that the
      # evidence is valid at all, on the npm path a consumer uses.
      #
      # unimport@7.0.2 (Nuxt 4.6's) advertises provenance, but the registry
      # answers 404 for its attestation, and the audit stops at the first
      # 404 — verifying nothing else. An npm-side fault, not the package's:
      # unjs/unimport#568, and whatwg-url@17.1.1, published the same day, has
      # it too. While the 404 lasts, this check reads 7.0.1 in its place, so
      # every other package is still verified. It stops pinning by itself
      # once npm serves the attestation (a 200 — any other answer, a network
      # failure included, keeps the pin), and says so.
      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke-integrations
        run: | # zizmor: ignore[adhoc-packages]
          if [ "$(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/-/npm/v1/attestations/unimport@7.0.2)" = 200 ]; then
            echo "::warning::npm now serves unimport@7.0.2's attestation — remove the pin in this step (unjs/unimport#568)."
          else
            node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.overrides = { ...p.overrides, 'unimport@7.0.2': '7.0.1' }; fs.writeFileSync('package.json', JSON.stringify(p, null, 2))"
            npx --yes npm@11.17.0 install --no-audit --no-fund
          fi
          npx --yes npm@11.17.0 audit signatures

  # Looks at the dependencies a pull request adds or changes, and fails on a
  # known CVE or a package GitHub has flagged as malicious. pnpm's cooldown only
  # delays a new version; it never looks at what is inside it.
  #
  # Pull requests only: the action compares two commits, so there is nothing to
  # compare on a push. It installs nothing, so no code from the PR runs here.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The only job that holds the coverage upload credential. It downloads an
  # artifact and installs nothing, so no code from the pull request ever runs
  # beside it.
  #
  # `ubuntu-latest` rather than `ubuntu-slim`: codecov-action checks the CLI it
  # downloads with gpg, which the slim image is not documented to ship.
  coverage:
    needs: test
    # Runs whenever `test` ran, failures included: a failing run's JUnit report
    # is what Codecov's flaky-test detection needs. Skipped whenever `test` is,
    # since there would be no artifact to upload. `!cancelled()` on its own is
    # not enough: a skipped `test` would leave this job downloading an artifact
    # that was never produced, and failing for a confusing reason. A `test` run
    # that failed before uploading one fails this job too, which blocks nothing:
    # `All checks passed` does not wait for it.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov over OIDC, so there is no stored token. It is the only job in
      # this file that holds `id-token: write`, and that is why coverage is its
      # own job: it downloads an artifact and installs nothing, so no code from
      # the pull request ever runs beside the credential.
      id-token: write
    steps:
      # Codecov maps coverage paths onto the repository, so the files have to
      # be here. Nothing is installed and nothing is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          slug: qruto/nuxt-convex-module
          disable_search: true
          files: coverage/lcov.info

      # Run times, failures and flaky-test detection. Runs even when tests
      # fail, which is when it matters.
      #
      # The same action as above with `report_type: test_results`, not
      # `codecov/test-results-action`. That one now prints a deprecation notice
      # telling you to do exactly this, and it still targets Node 20, which the
      # runners are already force-upgrading.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          slug: qruto/nuxt-convex-module
          disable_search: true
          files: test-report.junit.xml

  # The one required status check, and the only name the branch ruleset knows.
  # Every job above reports into it, so adding, renaming or splitting a job never
  # means editing the ruleset. `skipped` counts as a pass: `dependency-review` is
  # skipped on pushes, and `test`/`pack` are skipped when no source changed.
  all-checks:
    name: All checks passed
    if: ${{ always() }}
    # `coverage` is deliberately not listed. Codecov is a reporting service,
    # and a third party being down must not block a merge. The coverage
    # thresholds themselves are enforced by vitest inside `test`, which is
    # listed.
    needs:
      - changes
      - static
      - test
      - pack
      - dependency-review
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled)
                echo "::error::A required job did not pass: $result"
                exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."

  # The Monday run is where a new Nuxt or Convex release meets the module first
  # (the `pack` smoke tests install the newest of each), and a failed scheduled
  # run only emails whoever last edited the cron. File it on weekly.yml's drift
  # issue instead; see the `report` job there for why an issue, and why it is
  # matched by exact title.
  report:
    needs: all-checks
    if: ${{ always() && github.event_name == 'schedule' && needs.all-checks.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'ci (scheduled): a required job failed\n\n%s\n' "$RUN_URL")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "ci: weekly drift")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title 'ci: weekly drift' --body "$body"
          fi
