# GitHub Release notes configuration
# Controls the default "Generate release notes" behavior in the GitHub UI
# and when using `gh release create --generate-notes`.
#
# The release workflow does not use it: `changelogen gh release` creates the
# Release from the section changelogen wrote into CHANGELOG.md, which already
# carries the conventional grouping and the contributor thanks. This config is
# the fallback for notes generated by hand from the GitHub UI.

changelog:
  exclude:
    labels:
      - ignore-for-release
      - bot
  categories:
    - title: '🚀 Features'
      labels:
        - feat
        - enhancement
        - 'type: feature'
    - title: '🐛 Bug Fixes'
      labels:
        - fix
        - bug
        - 'type: bug'
    - title: '📝 Documentation'
      labels:
        - docs
    - title: '🔧 Maintenance & Chores'
      labels:
        - chore
        - refactor
        - ci
        - test
        - build
        - deps
        - dependencies
    - title: '⚠️ Breaking Changes'
      labels:
        - breaking
        - 'type: breaking'
    - title: '👏 Contributors'
      labels:
        - contributor
      collapse-after: 3
    - title: 'Other Changes'
      labels:
        - '*'
      collapse-after: 5
