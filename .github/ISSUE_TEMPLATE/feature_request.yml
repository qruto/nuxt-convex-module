name: Feature request
description: Suggest a feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This module is a faithful port of Convex's own client — see
        [PARITY.md](https://github.com/qruto/nuxt-convex-module/blob/main/PARITY.md).
        Anything that changes an upstream API belongs upstream first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What the API or behaviour would look like. Alternatives you considered, if any.
    validations:
      required: true
  - type: checkboxes
    id: would-pr
    attributes:
      label: Contribution
      options:
        - label: I can submit a PR for this
