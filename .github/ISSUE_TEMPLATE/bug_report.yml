name: Bug report
description: Something in nuxt-convex-module is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security vulnerability**? Report it privately via
        [Security Advisories](https://github.com/qruto/nuxt-convex-module/security/advisories/new),
        not here.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal repo or StackBlitz, or the steps to get there.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `npx nuxi info`, plus your `nuxt-convex-module` version.
      render: shell
    validations:
      required: true
