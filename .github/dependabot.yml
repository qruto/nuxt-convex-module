# Dependabot owns every dependency PR here: npm version updates, GitHub Actions
# digest bumps, and CVE fixes (security updates are enabled in the repo's
# Code security settings). No third-party app holds write access to this repo.
#
# `cooldown` mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml) but one day
# wider, so Dependabot never proposes a version pnpm will refuse to resolve.
# Keep the exclude list in sync with minimumReleaseAgeExclude there.
# Security updates are exempt from cooldown by design — CVE fixes ship as fast
# as pnpm's own 24h gate allows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
      exclude:
        - nuxt
        - 'nuxt-*'
        - '@nuxt/*'
        - '@nuxtjs/*'
        - convex
        - '@convex-dev/*'
    # `@convex-dev/better-auth` accepts `better-auth: ">=1.6.11 <1.7.0"`, and
    # this package mirrors it as `~1.6.11` — the same set of versions, written
    # the way installed-check normalises to. A 1.7.x bump counts as a minor
    # update, so without this the group below would propose one that the add-on
    # then rejects at install time. Drop this entry when @convex-dev/better-auth
    # supports better-auth 1.7 (and widen the peer range with it).
    ignore:
      - dependency-name: better-auth
        versions: ['>=1.7.0']
    groups:
      all-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # Actions digest bumps — keeps the `@<sha> # vX.Y.Z` pinning convention
  # intact. Native workflow-file writes: no PAT, no GitHub App.
  #
  # `/` on its own covers .github/workflows/ and an action.yml at the root. It
  # does not look inside .github/actions/*/action.yml, which is where the
  # `pnpm/setup` pin that every ci and preview job uses lives. Without the second
  # entry that pin would freeze while release.yml's own copies of the same action
  # keep moving, and the two would quietly drift apart. Nothing else would catch
  # it: zizmor checks that a pin exists, not that it is up to date.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
