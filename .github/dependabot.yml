# Dependabot owns every dependency PR here: npm version updates, GitHub Actions
# digest bumps, and CVE fixes (security updates are enabled in the repo's
# Code security settings). No third-party app holds write access to this repo.
#
# `cooldown` mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml) but one day
# wider, so Dependabot never proposes a version pnpm will refuse to resolve.
# Keep the exclude list in sync with minimumReleaseAgeExclude there.
# Security updates are exempt from cooldown by design — CVE fixes ship as fast
# as pnpm's own 24h gate allows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
      exclude:
        - nuxt
        - 'nuxt-*'
        - '@nuxt/*'
        - '@nuxtjs/*'
        - convex
        - '@convex-dev/*'
    # `@convex-dev/better-auth` peers `better-auth: ">=1.6.11 <1.7.0"`, and this
    # package mirrors it as `~1.6.11` — the same set, written the way
    # installed-check normalises to. A 1.7.x bump is a *minor* update, so the
    # all-non-major group below would otherwise propose one that the add-on
    # rejects at install time. Drop this entry when @convex-dev/better-auth
    # ships better-auth 1.7 support (and widen the peer range with it).
    ignore:
      - dependency-name: better-auth
        versions: ['>=1.7.0']
    groups:
      all-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # Actions digest bumps — keeps the `@<sha> # vX.Y.Z` pinning convention
  # intact. Native workflow-file writes: no PAT, no GitHub App.
  #
  # `/` alone reads .github/workflows/ and a ROOT-level action.yml — it does not
  # descend into .github/actions/*/action.yml. That directory holds the
  # `pnpm/setup` pin every ci and preview job runs on, so without the second
  # entry it freezes while release.yml's inline copies of the same action keep
  # moving, and the two paths silently diverge. Nothing else notices: zizmor
  # checks that a pin exists, not that it is current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
