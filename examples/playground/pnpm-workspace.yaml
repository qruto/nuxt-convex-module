# Settings for this app when it is installed on its own — `nuxi init` clones
# this directory, and StackBlitz receives it the same way. The repository
# root's pnpm-workspace.yaml does not come along.
#
# esbuild's build script is the one this Nuxt tree needs, so it is approved.
# pnpm 11+ fails an install on any other unapproved build script
# (`strictDepBuilds`, on by default); `nuxi init` then cancels the scaffold,
# and its module picker fails too — @nuxt/eslint pulls in unrs-resolver.
# With the flag off, pnpm skips those scripts and lists them instead;
# approve one with `pnpm approve-builds` when a package needs it.
allowBuilds:
  esbuild: true
strictDepBuilds: false
